<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Mobile Barcode Scanner</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: black;
        height: 100vh;
        overflow: hidden;
    }

    /* Full screen camera */
    #scanner {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1;
    }

    /* Bottom result box */
    #resultBox {
        position: fixed;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        background: white;
        border-radius: 12px;
        padding: 14px;
        text-align: center;
        z-index: 10;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    #resultBox label {
        font-size: 14px;
        color: #555;
        display: block;
        margin-bottom: 5px;
    }

    #barcodeText {
        font-size: 22px;
        font-weight: bold;
        color: green;
        letter-spacing: 1px;
    }

    /* Hide Quagga debug UI */
    canvas, video {
        max-width: 100%;
        max-height: 100%;
    }
</style>
</head>
<body>

<!-- Camera -->
<div id="scanner"></div>

<!-- Bottom barcode display -->
<div id="resultBox">
    <label>Scanned Barcode</label>
    <div id="barcodeText">---</div>
</div>

<!-- ❗ LOCKED CODE (NOT MODIFIED) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>

<script>
    Quagga.init({
        inputStream: {
            name: "Live",
            type: "LiveStream",
            target: document.querySelector('#scanner'),
            constraints: {
                facingMode: "environment"
            }
        },
        decoder: {
            readers: [
                "code_128_reader",
                "ean_reader",
                "ean_8_reader",
                "upc_reader",
                "upc_e_reader"
            ]
        }
    }, function (err) {
        if (err) {
            console.log(err);
            return;
        }
        Quagga.start();
    });

    Quagga.onDetected(function (data) {
        let code = data.codeResult.code;
        document.getElementById("barcodeText").innerText = code;
    });
</script>

</body>
</html>

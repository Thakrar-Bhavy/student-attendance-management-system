<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Barcode Scanner</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: black;
    }

    /* Full screen camera */
    #scanner {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
    }

    /* Bottom white line */
    .bottom-line {
        position: fixed;
        bottom: 70px;
        left: 10%;
        width: 80%;
        height: 3px;
        background: white;
        border-radius: 10px;
        z-index: 10;
    }

    /* Barcode text */
    .barcode-output {
        position: fixed;
        bottom: 20px;
        width: 100%;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
        color: #00ff4c;
        z-index: 10;
    }
</style>
</head>

<body>

<div id="scanner"></div>

<div class="bottom-line"></div>

<div class="barcode-output">
    <span id="barcodeText">Waiting for scan...</span>
</div>

<!-- ❗ KEEP THIS SCRIPT EXACTLY SAME -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>

<script>
    Quagga.init({
        inputStream: {
            name: "Live",
            type: "LiveStream",
            target: document.querySelector('#scanner'),
            constraints: {
                facingMode: "environment"
            }
        },
        decoder: {
            readers: [
                "code_128_reader",
                "ean_reader",
                "ean_8_reader",
                "upc_reader",
                "upc_e_reader"
            ]
        }
    }, function (err) {
        if (err) {
            console.log(err);
            return;
        }
        Quagga.start();
    });

    Quagga.onDetected(function (data) {
        let code = data.codeResult.code;
        document.getElementById("barcodeText").innerText = code;
    });
</script>

</body>
</html>

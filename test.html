<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Mobile Barcode Scanner</title>

<style>
/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* FULL SCREEN CAMERA */
html, body {
    width: 100%;
    height: 100%;
    background: black;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* CAMERA VIEW */
#scanner {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    z-index: 1;
}

/* BOTTOM RESULT BOX */
#resultBox {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 360px;
    background: white;
    border-radius: 12px;
    padding: 12px;
    text-align: center;
    z-index: 2;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

/* LABEL */
#resultBox span {
    font-size: 20px;
    font-weight: bold;
    color: #1fae4b; /* green */
    letter-spacing: 1px;
}

/* OPTIONAL CAMERA GUIDE */
#guide {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 80%;
    height: 120px;
    transform: translate(-50%, -50%);
    border: 2px dashed rgba(255,255,255,0.7);
    border-radius: 10px;
    z-index: 2;
}
</style>
</head>
<body>

<!-- CAMERA -->
<div id="scanner"></div>

<!-- OPTIONAL SCAN GUIDE -->
<div id="guide"></div>

<!-- RESULT -->
<div id="resultBox">
    <span id="barcodeText">Scan Barcode</span>
</div>

<!-- ❗ YOUR CODE — NOT MODIFIED ❗ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>

<script>
    Quagga.init({
        inputStream: {
            name: "Live",
            type: "LiveStream",
            target: document.querySelector('#scanner'),
            constraints: {
                facingMode: "environment" // back camera
            }
        },
        decoder: {
            readers: [
                "code_128_reader",
                "ean_reader",
                "ean_8_reader",
                "upc_reader",
                "upc_e_reader"
            ]
        }
    }, function (err) {
        if (err) {
            console.log(err);
            return;
        }
        Quagga.start();
    });

    Quagga.onDetected(function (data) {
        let code = data.codeResult.code;
        document.getElementById("barcodeText").innerText = code;
    });
</script>

</body>
</html>
